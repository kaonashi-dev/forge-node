# Servers. A server is launched only when `[lsp] enabled = true`, only for a
# human editor session, and only after `probe` succeeds against the resolved
# binary. `root_markers` is searched upward from the file, never past the
# checkout; an inner list is one priority level. `outermost` takes the top-most
# directory with a marker (a Cargo workspace), `nearest` the closest one (a
# package inside a monorepo).

[server.rust-analyzer]
command = "rust-analyzer"
args = []
root_markers = [["Cargo.lock"], ["Cargo.toml"]]
root_strategy = "outermost"
probe = { args = ["--version"], expect = "rust-analyzer" }
# `cargo.targetDir` keeps rust-analyzer's `cargo check` off the `target/` lock
# an agent's `cargo test` is waiting on, at the price of a second build dir.
initialization_options = { cargo = { targetDir = true }, files = { watcher = "server" }, checkOnSave = false }

[server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]
root_markers = [["tsconfig.json", "jsconfig.json"], ["package.json"]]
root_strategy = "nearest"
probe = { args = ["--version"], expect = "" }

[server.gopls]
command = "gopls"
args = []
root_markers = [["go.work"], ["go.mod"]]
root_strategy = "outermost"
probe = { args = ["version"], expect = "gopls" }

[server.pyright]
command = "pyright-langserver"
args = ["--stdio"]
root_markers = [["pyrightconfig.json", "pyproject.toml"], ["setup.py", "setup.cfg", "requirements.txt"]]
root_strategy = "nearest"
# `pyright-langserver` has no version flag of its own; the probe asks the
# `pyright` CLI that ships beside it.
probe = { command = "pyright", args = ["--version"], expect = "pyright" }

[server.clangd]
command = "clangd"
args = []
root_markers = [["compile_commands.json", "compile_flags.txt", ".clangd"]]
root_strategy = "nearest"
probe = { args = ["--version"], expect = "clangd" }
