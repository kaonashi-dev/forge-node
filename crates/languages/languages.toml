# Built-in languages and language servers.
#
# Data, not code: adding a language is an entry here (and, for a syntax index,
# a grammar plus query files in `crates/syntax-index`). The user's config TOML
# overrides any field under `[lsp]`; nothing in a repository can.
#
# `family` groups languages that resolve each other's names (a `.tsx` file
# imports from `.ts`), and is what "same language" means when candidates are
# ranked by closeness. `declarations = false` marks prose and data formats
# whose lines must never be offered as a declaration.

[[language]]
id = "rust"
extensions = ["rs"]
grammar = "rust"
line_comments = ["//"]
block_comments = [["/*", "*/"]]
quotes = ["\""]
servers = ["rust-analyzer"]

[[language]]
id = "typescript"
extensions = ["ts", "mts", "cts"]
family = "typescript"
grammar = "typescript"
line_comments = ["//"]
block_comments = [["/*", "*/"]]
servers = ["typescript-language-server"]

