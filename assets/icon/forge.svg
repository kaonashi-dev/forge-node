<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0.12" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#3c3836"/>
      <stop offset="0.48" stop-color="#282828"/>
      <stop offset="1" stop-color="#1d2021"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.47" cy="0.45" r="0.52">
      <stop offset="0" stop-color="#fe8019" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#d65d0e" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#d65d0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="molten" gradientUnits="userSpaceOnUse" x1="256" y1="512" x2="574" y2="512">
      <stop offset="0" stop-color="#d65d0e"/>
      <stop offset="0.42" stop-color="#fe8019"/>
      <stop offset="0.72" stop-color="#fabd2f"/>
      <stop offset="1" stop-color="#fbf1c7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf1c7"/>
      <stop offset="0.52" stop-color="#ebdbb2"/>
      <stop offset="1" stop-color="#a89984"/>
    </linearGradient>
    <radialGradient id="node" cx="0.38" cy="0.30" r="0.76">
      <stop offset="0" stop-color="#fbf1c7"/>
      <stop offset="0.42" stop-color="#fabd2f"/>
      <stop offset="1" stop-color="#fe8019"/>
    </radialGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="ember-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <!-- Inset to macOS safe zone (~82%): full-bleed tiles read oversized in Cmd+Tab. -->
  <g transform="translate(512 512) scale(0.82) translate(-512 -512)">
  <!-- Gruvbox tile: the app's native dark surface, not a generic black badge. -->
  <rect width="1024" height="1024" rx="224" fill="url(#background)"/>
  <rect x="14" y="14" width="996" height="996" rx="212" fill="none" stroke="#504945" stroke-width="4" stroke-opacity="0.55"/>
  <circle cx="486" cy="486" r="390" fill="url(#ambient)"/>

  <!-- A terminal prompt whose three joints form Forge's parent/child session graph. -->
  <g fill="none" stroke-linecap="round">
    <path d="M314 304 L524 512 M314 720 L524 512" stroke="#111313" stroke-width="124" stroke-opacity="0.72" transform="translate(0 24)" filter="url(#soft-shadow)"/>
    <path d="M314 304 L524 512 M314 720 L524 512" stroke="#fe8019" stroke-width="164" stroke-opacity="0.18" filter="url(#ember-glow)"/>
    <path d="M314 304 L524 512 M314 720 L524 512" stroke="url(#molten)" stroke-width="94"/>
    <path d="M314 304 L524 512 M314 720 L524 512" stroke="#fbf1c7" stroke-width="18" stroke-opacity="0.38"/>
  </g>

  <!-- Node cores keep the graph readable without compromising the > silhouette. -->
  <g>
    <circle cx="314" cy="304" r="60" fill="#1d2021" stroke="#d65d0e" stroke-width="14"/>
    <circle cx="314" cy="304" r="28" fill="url(#node)"/>
    <circle cx="314" cy="720" r="60" fill="#1d2021" stroke="#d65d0e" stroke-width="14"/>
    <circle cx="314" cy="720" r="28" fill="url(#node)"/>
    <circle cx="524" cy="512" r="66" fill="#1d2021" stroke="#fabd2f" stroke-width="14"/>
    <circle cx="524" cy="512" r="33" fill="url(#node)"/>
    <circle cx="514" cy="501" r="9" fill="#fff" fill-opacity="0.72"/>
  </g>

  <!-- The cursor completes the terminal prompt and anchors the mark at small sizes. -->
  <rect x="606" y="646" width="202" height="96" rx="48" fill="#111313" fill-opacity="0.65" transform="translate(0 20)" filter="url(#soft-shadow)"/>
  <rect x="584" y="624" width="246" height="140" rx="70" fill="#fe8019" fill-opacity="0.15" filter="url(#ember-glow)"/>
  <rect x="606" y="646" width="202" height="96" rx="48" fill="url(#metal)"/>
  <rect x="634" y="662" width="146" height="18" rx="9" fill="#fff" fill-opacity="0.30"/>
  </g>
</svg>
