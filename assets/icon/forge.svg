<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Geometric mark. The raster app icon is forge-1024.png. -->
  <defs>
    <linearGradient id="tile" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#1a1a1c"/>
      <stop offset="0.55" stop-color="#0e0e10"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="stone" x1="0.22" y1="0.05" x2="0.88" y2="1">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="0.45" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="molten" gradientUnits="userSpaceOnUse" x1="360" y1="280" x2="680" y2="760">
      <stop offset="0" stop-color="#d65d0e"/>
      <stop offset="0.4" stop-color="#fe8019"/>
      <stop offset="0.72" stop-color="#fabd2f"/>
      <stop offset="1" stop-color="#fbf1c7"/>
    </linearGradient>
    <radialGradient id="core" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#fbf1c7"/>
      <stop offset="0.45" stop-color="#fabd2f"/>
      <stop offset="1" stop-color="#d65d0e"/>
    </radialGradient>
    <filter id="ember" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="hex">
      <polygon points="512,172 806,342 806,682 512,852 218,682 218,342"/>
    </clipPath>
  </defs>

  <!-- Inset to the macOS safe zone so a full-bleed tile does not read oversized in Cmd+Tab. -->
  <g transform="translate(512 512) scale(0.82) translate(-512 -512)">
    <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
    <rect x="12" y="12" width="1000" height="1000" rx="214" fill="none" stroke="#3a3a3e" stroke-width="3" stroke-opacity="0.45"/>

    <g>
      <polygon points="512,172 806,342 806,682 512,852 218,682 218,342" fill="#050506" opacity="0.55" transform="translate(10 18)"/>
      <polygon points="512,172 806,342 806,682 512,852 218,682 218,342" fill="url(#stone)"/>
      <polygon points="512,172 806,342 806,682 512,852 218,682 218,342" fill="none" stroke="#5a5a60" stroke-width="5" stroke-opacity="0.35"/>
      <path d="M806 342 L806 682 L512 852" fill="none" stroke="#fe8019" stroke-width="6" stroke-opacity="0.22" stroke-linejoin="round"/>

      <polygon points="512,172 556,468 806,512 556,556 512,852 468,556 218,512 468,468" fill="#fe8019" fill-opacity="0.22" filter="url(#ember)"/>
      <g clip-path="url(#hex)">
        <polygon points="512,172 556,468 806,512 556,556 512,852 468,556 218,512 468,468" fill="url(#molten)"/>
      </g>
      <polygon points="512,478 538,493 538,531 512,546 486,531 486,493" fill="#1d2021"/>
      <polygon points="512,478 538,493 538,531 512,546 486,531 486,493" fill="url(#core)"/>
      <polygon points="504,496 522,488 526,508" fill="#fff" fill-opacity="0.35"/>
    </g>
  </g>
</svg>
