[package]
name = "forge-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "938ba14f09bb3381946b3486ef8aa36363a3e8b2", default-features = false, features = ["metal-backend", "embedded-fonts", "accessibility", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "938ba14f09bb3381946b3486ef8aa36363a3e8b2", features = ["markdown"] }
client = { path = "../../crates/client" }
domain = { path = "../../crates/domain" }
terminal-input = { path = "../../crates/terminal-input" }
protocol = { path = "../../crates/protocol" }
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }
swash = "0.2.10"
fontique = "0.12.0"

[profile.release]
debug = 1
codegen-units = 16
lto = false
