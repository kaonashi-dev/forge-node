[package]
name = "forge-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "938ba14f09bb3381946b3486ef8aa36363a3e8b2", default-features = false, features = ["metal-backend", "embedded-fonts", "accessibility", "native-file-dialog", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "938ba14f09bb3381946b3486ef8aa36363a3e8b2", features = ["markdown"] }
client = { path = "../../crates/client" }
domain = { path = "../../crates/domain" }
terminal-input = { path = "../../crates/terminal-input" }
editor-control = { path = "../../crates/editor-control" }
flume = "0.11"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }
swash = "0.2.10"
fontique = "0.12.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
minisign-verify = "0.2.5"
tar = "0.4"
flate2 = "1"
semver = "1"

[dev-dependencies]
pollster = "1"

[profile.release]
debug = 1
codegen-units = 16
lto = false

# The root workspace's lints; this client is its own workspace and would not
# inherit them.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
dbg_macro = "warn"
unwrap_used = "warn"
todo = "warn"
