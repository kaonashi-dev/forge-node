<!doctype html>
<html lang="en" data-theme="calm-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge Node</title>
    <!--
      P12. `TerminalPane` asks for the face by name (`document.fonts.load`)
      before it measures a cell: without this the request for the face does not
      start until the stylesheet has been fetched and parsed, which is the
      whole of first paint. Regular alone — Bold and Italic are wanted by the
      time something is on screen, not before it.
    -->
    <link
      rel="preload"
      href="/fonts/GeistMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/Geist-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
