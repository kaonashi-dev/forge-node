[package]
name = "forge-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Tauri desktop host for Forge Node"
build = "build.rs"
default-run = "forge-tauri"

[lib]
name = "forge_tauri"
path = "src/lib.rs"

[[bin]]
name = "forge-tauri"
path = "src/main.rs"

[[bin]]
name = "forge-tauri-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "forge-tauri-latency"
path = "src/bin/latency.rs"

# `tauri`'s build script turns `custom-protocol` into `cargo:dev=false`, and
# that flag is the whole difference between a bundle that carries the frontend
# and one that does not: in dev mode `generate_context!` embeds nothing and the
# webview is pointed at `devUrl` (http://localhost:1420). The Tauri CLI passes
# the feature for you; `scripts/package-macos` calls cargo directly, so it has
# to pass it itself — without it the packaged app opens a white window waiting
# on a dev server that is not running.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
client.workspace = true
directories.workspace = true
domain.workspace = true
flume.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
compact_str.workspace = true
