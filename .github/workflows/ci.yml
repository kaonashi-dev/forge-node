name: CI

# The same gate `scripts/dev check` runs locally: fmt → clippy → test for the
# root workspace, then the Rune client on its own toolchain. macOS only: no
# Linux artifact is published yet.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded PR run has nothing to say; cancel it instead of paying twice.
# Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  workspace:
    name: workspace + Rune (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (both pinned toolchains)
        run: |
          rustup show
          ( cd apps/ui && rustup show )

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/ui -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Gate (fmt, clippy, test for the workspace and apps/ui)
        run: scripts/dev check
