name: CI

# The same gate `scripts/dev check` runs locally (fmt → clippy → test) plus the
# frontend's `bun run check`, both on macOS. No Linux job: no Linux artifact is
# published yet.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded PR run has nothing to say; cancel it instead of paying twice.
# Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental artifacts are pure overhead on a cold, cached-from-scratch CI
  # runner.
  CARGO_INCREMENTAL: 0

jobs:
  workspace:
    name: workspace (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Gate (fmt, clippy, test)
        run: scripts/dev check

  tauri:
    name: tauri (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        working-directory: apps/tauri
        run: bun install --frozen-lockfile

      - name: Check frontend (lint, format, tests, types, bundle)
        working-directory: apps/tauri
        run: bun run check
