name: Release

# A tag is the trigger and the version is the workspace's: the tag only has to
# agree with it, which step "Version agrees with the tag" enforces before
# anything is built. `ci.yml` still owns pull requests and pushes to main.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    name: macOS (arm64)
    # The same image `ci.yml` gates on. Pinned older images drift: macos-14
    # fails a PTY scenario that macos-latest passes on the same commit, and a
    # release gate that judges different code than CI is not a gate.
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (both pinned toolchains)
        run: |
          rustup show
          ( cd apps/ui && rustup show )

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/ui -> target
          key: release-macos-arm64

      - name: Install the updater signer
        run: brew install minisign

      # A mislabelled release is worse than a failed one: every installed app
      # compares the manifest's version against its own bundle.
      - name: Version agrees with the tag
        run: |
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)"
          tag="${GITHUB_REF_NAME#v}"
          [ "$version" = "$tag" ] || {
            echo "tag $GITHUB_REF_NAME does not match [workspace.package] version $version" >&2
            exit 1
          }
          echo "version=$version" >>"$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Gate
        run: scripts/dev check

      - name: Build the signed bundle and updater artifact
        env:
          FORGE_UPDATER_KEY: ${{ secrets.FORGE_UPDATER_KEY }}
          FORGE_CODESIGN_IDENTITY: ${{ secrets.FORGE_CODESIGN_IDENTITY }}
          FORGE_NOTARY_PROFILE: ${{ secrets.FORGE_NOTARY_PROFILE }}
        run: scripts/package-macos --updater --zip

      - name: Write latest-rune.json
        run: |
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" >/tmp/notes.md
          scripts/release-manifest \
            "$version" "$GITHUB_REF_NAME" \
            "dist/release/ForgeNode-${version}-darwin-aarch64.app.tar.gz" \
            /tmp/notes.md >dist/release/latest-rune.json
          cat dist/release/latest-rune.json

      # The tarball is what a running app swaps in; the zip is what a person
      # downloads to install Forge Node the first time.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A second copy under a version-free name, so
          # releases/latest/download/ForgeNode-macos-arm64.zip is a link the
          # README can keep. The versioned one stays: a file in a Downloads
          # folder should say which build it is.
          cp "dist/macos/ForgeNode-${version}.zip" dist/macos/ForgeNode-macos-arm64.zip
          assets=(
            "dist/release/ForgeNode-${version}-darwin-aarch64.app.tar.gz"
            "dist/release/ForgeNode-${version}-darwin-aarch64.app.tar.gz.sig"
            "dist/release/latest-rune.json"
            "dist/macos/ForgeNode-${version}.zip"
            "dist/macos/ForgeNode-macos-arm64.zip"
          )
          # A release cut by hand for the same tag must not fail the pipeline:
          # re-uploading is the idempotent half of "publish".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Forge Node $GITHUB_REF_NAME" \
              --notes-file /tmp/notes.md \
              "${assets[@]}"
          fi
